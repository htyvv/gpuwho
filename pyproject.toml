[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpuwho"
dynamic = ["version"]
description = "nvidia-smi for every server in your lab: who is using which GPU, over plain SSH, nothing to install on the servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Taeyeong Heo" }]
requires-python = ">=3.9"
dependencies = [
    "rich>=12.0",
    "paramiko>=2.10",
]
keywords = [
    "gpu", "nvidia", "nvidia-smi", "nvml", "gpustat", "gpu-monitoring", "ssh", "cluster",
    "multi-server", "monitoring", "tui", "terminal", "deep-learning", "lab", "htop",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Clustering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/htyvv/gpuwho"
Source = "https://github.com/htyvv/gpuwho"
Issues = "https://github.com/htyvv/gpuwho/issues"
Changelog = "https://github.com/htyvv/gpuwho/blob/main/CHANGELOG.md"

[project.scripts]
gpuwho = "gpuwho.cli:main"

[tool.hatch.version]
path = "gpuwho/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["gpuwho"]

[tool.hatch.build.targets.sdist]
include = ["gpuwho", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.per-file-ignores]
# the agent is piped to servers that may only have Python 3.6
"gpuwho/probe.py" = ["B"]
