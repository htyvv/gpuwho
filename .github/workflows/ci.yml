name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: client and agent (Linux)
        if: runner.os == 'Linux'
        run: cargo test --workspace
      - name: client (the agent reads /proc, Linux only)
        if: runner.os != 'Linux'
        run: cargo test -p gpuwho

  # The Rust agent is uploaded to whatever Linux the servers run: build it against
  # glibc 2.17 like the release does, and run it on CentOS 7 (glibc 2.17).
  agent-old-glibc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: pip install ziglang
      - run: |
          cargo zigbuild --release -p gpuwho-agent --target x86_64-unknown-linux-gnu.2.17
          cargo zigbuild --release -p gpuwho-agent --target aarch64-unknown-linux-gnu.2.17
      - name: run on CentOS 7
        run: |
          cp target/x86_64-unknown-linux-gnu/release/gpuwho-agent /tmp/agent
          printf '\n' | docker run --rm -i -v /tmp/agent:/agent:ro centos:7 /agent 30 > /tmp/out.txt
          python3 -c "import json; docs = [json.loads(l) for l in open('/tmp/out.txt') if l.strip()]; snap = docs[-1]; assert 'fatal' not in snap, snap; print(snap['cpu'], snap['nvml'], snap['agent'])"

  # probe.py, the fallback agent, is piped to servers with python3 as old as 3.6
  agent-python:
    name: agent-python (py${{ matrix.python }})
    runs-on: ubuntu-24.04  # pinned: setup-python has no 3.9 build for 26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest

  agent-python-old:
    name: agent-python-old (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.6", "3.7", "3.8"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: run probe.py on python:${{ matrix.python }}-slim
        run: |
          printf '\n' \
            | docker run --rm -i -v "$PWD/crates/gpuwho/assets/probe.py:/probe.py:ro" python:${{ matrix.python }}-slim python3 -u /probe.py 30 \
            | python3 -c "import json, sys; d = json.loads(sys.stdin.readline()); assert 'fatal' not in d, d; print(d['cpu'], d['nvml'])"

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install "maturin>=1.9,<2" ziglang
      - run: maturin build --release --zig --compatibility manylinux2014 -o dist
      - name: install the wheel in a clean venv
        run: |
          python3 -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/gpuwho --version
          /tmp/clean/bin/gpuwho demo | head -3
