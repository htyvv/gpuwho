[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

# The Python package is just the Rust binary (like ruff or uv): `pipx install gpuwho`.
[project]
name = "gpuwho"
dynamic = ["version"]
description = "nvidia-smi for every server in your lab: who is using which GPU, over plain SSH, nothing to install on the servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Taeyeong Heo" }]
requires-python = ">=3.8"
keywords = [
    "gpu", "nvidia", "nvidia-smi", "nvml", "gpustat", "gpu-monitoring", "ssh", "cluster",
    "multi-server", "monitoring", "tui", "terminal", "deep-learning", "lab", "htop", "mcp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Clustering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/htyvv/gpuwho"
Source = "https://github.com/htyvv/gpuwho"
Issues = "https://github.com/htyvv/gpuwho/issues"
Changelog = "https://github.com/htyvv/gpuwho/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/gpuwho/Cargo.toml"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
line-length = 120
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
